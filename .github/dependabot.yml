version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: cron
      cronjob: '0 9 1,15 * *'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    reviewers:
      - moj-analytical-services/uk_address_matcher
  - package-ecosystem: npm
    directory: /frontend/labelling
    schedule:
      interval: cron
      cronjob: '0 9 1,15 * *'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    reviewers:
      - moj-analytical-services/uk_address_matcher
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 9 1,15 * *'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    reviewers:
      - moj-analytical-services/uk_address_matcher