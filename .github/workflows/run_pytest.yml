name: Run pytest

on:
  workflow_call:
  pull_request:
    paths:
      - "uk_address_matcher/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
  push:
    branches: [main]
    paths:
      - "uk_address_matcher/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"

permissions:
  contents: read

concurrency:
  group: run-pytest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.3"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev --group model-training --locked

      - name: Install project in editable mode
        run: uv pip install -e .

      - name: Run pytest
        run: uv run pytest tests/ --ignore=tests/labelling -vv